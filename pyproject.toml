[project]
name = "sprout"
version = "0.1.0"
description = "Sprout: a family app for printable worksheets, kids' progress, coloring pages and project ideas"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.46",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "reportlab>=4",
    "pypdfium2>=5",
    "pillow>=11",
]

[project.scripts]
sprout = "sprout.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprout"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059", "RUF015"]
"src/sprout/auth.py" = ["TRY004"]
"src/sprout/ai.py" = ["TRY004"]
